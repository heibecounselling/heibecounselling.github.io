<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Heibe｜隨筆手記</title>
<meta name="description" content="Dr. Heibe｜輔導空間：獸醫與輔導之間的感想與故事，寫給寵物主人同獸醫同業。Reflections from a path between veterinary medicine and counselling.">
<meta property="og:type" content="website">
<meta property="og:title" content="Dr. Heibe｜隨筆手記">
<meta property="og:description" content="Dr. Heibe｜輔導空間：獸醫與輔導之間的感想與故事，寫給寵物主人同獸醫同業。Reflections from a path between veterinary medicine and counselling.">
<meta property="og:url" content="https://heibecounselling.com/essays.html">

<link rel="icon" href="images/logo.png">
<style>
@media (max-width: 1100px) {
  #page-root h1, #page-root h2, #page-root section div, #page-root section img, #page-root footer a, #page-root footer img { max-width: 100% !important; }
  #page-root section [style*="grid"] > * { min-width: 0; }
}
@media (max-width: 420px) {
  #page-root section [style*="grid-template-columns"] { grid-template-columns: minmax(0, 1fr) !important; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F2E9}
html{scroll-behavior:smooth}
a{color:#3E5040}a:hover{color:#26332A}
</style>
</head>
<body>
<div id="page-root"></div>
<template id="page-template">
<div style="background: #F7F2E9; color: #2E2A26; font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 17px; line-height: 1.75;">

<header style="position: sticky; top: 0; z-index: 10; background: #F7F2E9; border-bottom: 1px solid #E2D8C6;">
<div style="max-width: 1160px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
<a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px; line-height: 1.25; color: #2E2A26;">
<img src="images/logo.png" alt="Dr. Heibe｜輔導空間 標誌" style="width: 56px; height: 48px; object-fit: contain; mix-blend-mode: multiply; display: block;">
<span style="display: flex; flex-direction: column;">
<span style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 20px; color: #3E5040;">Dr. Heibe｜輔導空間</span>
<span style="font-size: 12px; letter-spacing: 0.08em; color: #5E574F;">{{t.sub}}</span>
</span>
</a>
<nav style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-size: 15px;">
<a href="/" style="text-decoration: none; color: #4A443D;">{{t.nav.home}}</a>
<a href="#owner-posts" style="text-decoration: none; color: #4A443D;">{{t.nav.owners}}</a>
<a href="#vet-posts" style="text-decoration: none; color: #4A443D;">{{t.nav.vets}}</a>
<a href="/blog" style="text-decoration: none; color: #4A443D;">{{t.nav.wall}}</a>
<div style="display: flex; border: 1px solid #C9BEA9; border-radius: 999px; overflow: hidden;" role="group" aria-label="Language">
<button type="button" onClick="{{setZh}}" style="{{zhStyle}}">中</button>
<button type="button" onClick="{{setEn}}" style="{{enStyle}}">EN</button>
</div>
<a href="https://forms.gle/92M658kcjwABPxq89" target="_blank" rel="noopener" style="text-decoration: none; background: #3E5040; color: #FFFDF8; padding: 10px 20px; border-radius: 999px; font-weight: 500; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center;">{{t.nav.book}}</a>
</nav>
</div>
</header>

<section style="position: relative; overflow: hidden; min-height: 460px; padding: 120px 24px 104px; margin-bottom: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
<img src="images/hero-cat.jpg" alt="" aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; opacity: 0.4; mix-blend-mode: multiply; display: block; pointer-events: none;">
<div style="position: relative; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px;">
<span style="font-size: 14px; letter-spacing: 0.12em; color: #5B6E55; font-weight: 500;">{{t.hero.eyebrow}}</span>
<h1 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: clamp(32px, 4.4vw, 48px); line-height: 1.35; color: #2F3D31;">{{t.hero.title}}</h1>
<p style="margin: 0; font-size: 18px; color: #4A443D; max-width: 32em;">{{t.hero.sub}}</p>
</div>
</section>

<section id="owner-posts" style="padding: 0 24px 72px;">
<div style="max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
<span style="font-size: 14px; letter-spacing: 0.12em; color: #5B6E55; font-weight: 500;">FOR PET OWNERS</span>
<h2 style="margin: 0 0 4px; font-family: 'Noto Serif TC', serif; font-size: clamp(26px, 3vw, 34px); line-height: 1.4; color: #2F3D31;">{{t.ownersPostsTitle}}</h2>
<sc-for list="{{ownerPosts}}" as="p" hint-placeholder-count="2">
<article style="background: #FFFDF8; border: 1px solid #E2D8C6; border-radius: 20px; padding: 28px 30px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
<span style="font-size: 13px; font-weight: 500; color: #33402F; background: #E4EBDD; padding: 3px 12px; border-radius: 999px;">{{p.tag}}</span>
<span style="font-size: 13px; color: #5E574F;">{{p.date}}</span>
</div>
<h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 22px; line-height: 1.5; color: #2F3D31;">{{p.title}}</h3>
<sc-if value="{{p.open}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #E2D8C6; padding-top: 18px; display: flex; flex-direction: column; gap: 14px;">
<sc-for list="{{p.paras}}" as="q" hint-placeholder-count="4">
<p style="margin: 0; font-size: 16px; color: #2E2A26; line-height: 1.9;">{{q.v}}</p>
</sc-for>
</div>
</sc-if>
<button type="button" onClick="{{p.toggle}}" aria-expanded="{{p.open}}" style="align-self: flex-start; background: none; border: 0; padding: 8px 0; min-height: 44px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #3E5040;">{{p.label}}</button>
</article>
</sc-for>
</div>
</section>

<section id="vet-posts" style="padding: 0 24px 72px;">
<div style="max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
<span style="font-size: 14px; letter-spacing: 0.12em; color: #5B6E55; font-weight: 500;">FOR VET PROFESSIONALS</span>
<h2 style="margin: 0 0 4px; font-family: 'Noto Serif TC', serif; font-size: clamp(26px, 3vw, 34px); line-height: 1.4; color: #2F3D31;">{{t.vetsPostsTitle}}</h2>
<sc-for list="{{vetPosts}}" as="p" hint-placeholder-count="2">
<article style="background: #FFFDF8; border: 1px solid #E2D8C6; border-radius: 20px; padding: 28px 30px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
<span style="font-size: 13px; font-weight: 500; color: #33402F; background: #E4EBDD; padding: 3px 12px; border-radius: 999px;">{{p.tag}}</span>
<span style="font-size: 13px; color: #5E574F;">{{p.date}}</span>
</div>
<h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 22px; line-height: 1.5; color: #2F3D31;">{{p.title}}</h3>
<sc-if value="{{p.open}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #E2D8C6; padding-top: 18px; display: flex; flex-direction: column; gap: 14px;">
<sc-for list="{{p.paras}}" as="q" hint-placeholder-count="4">
<p style="margin: 0; font-size: 16px; color: #2E2A26; line-height: 1.9;">{{q.v}}</p>
</sc-for>
</div>
</sc-if>
<button type="button" onClick="{{p.toggle}}" aria-expanded="{{p.open}}" style="align-self: flex-start; background: none; border: 0; padding: 8px 0; min-height: 44px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #3E5040;">{{p.label}}</button>
</article>
</sc-for>
</div>
</section>

<footer style="border-top: 1px solid #E2D8C6; padding: 56px 24px 32px;">
<div style="max-width: 1160px; margin: 0 auto 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
<a href="/" style="display: block;"><img src="images/logo.png" alt="Dr. Heibe｜輔導空間 Dr. Heibe Counselling 標誌" style="width: 220px; max-width: 60vw; height: auto; mix-blend-mode: multiply; display: block;"></a>
<span style="font-family: 'Noto Serif TC', serif; font-size: 16px; color: #5B6E55;">{{t.slogan}}</span>
</div>
<div style="max-width: 1160px; margin: 0 auto; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: #5E574F; border-top: 1px solid #E2D8C6; padding-top: 20px;">
<span>© 2026 Dr. Heibe｜輔導空間 · {{t.footTag}}</span>
<span style="display: flex; gap: 18px; flex-wrap: wrap;">
<a href="/">{{t.nav.home}}</a>
<a href="/vets">{{t.nav.vets}}</a>
<a href="/blog">{{t.nav.wall}}</a>
<a href="https://forms.gle/92M658kcjwABPxq89" target="_blank" rel="noopener">{{t.nav.book}}</a>
</span>
</div>
</footer>

</div>
</template>
<noscript><p style="padding:24px;font-family:sans-serif">請開啟瀏覽器的 JavaScript 以瀏覽本網站。Please enable JavaScript to view this website.</p></noscript>
<script src="content.js?v=27"></script>
<script src="site.js?v=14"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: null, open: {} };
  }
  renderVals() {
    const lang = this.state.lang || this.props.startLang || 'zh';
    const T = window.CONTENT.essays;
    const t = T[lang];
    const openMap = this.state.open;
    const posts = t.posts.map((p, i) => ({
      ...p, paras: p.paras.map(v => ({ v })), open: !!openMap[i], label: openMap[i] ? t.collapse : t.readMore,
      toggle: () => this.setState({ open: { ...this.state.open, [i]: !this.state.open[i] } })
    }));
    const base = 'border: 0; min-width: 44px; min-height: 36px; padding: 6px 12px; font-size: 14px; cursor: pointer; font-family: inherit;';
    const on = base + ' background: #3E5040; color: #FFFDF8;';
    const off = base + ' background: transparent; color: #4A443D;';
    return {
      t, posts,
      ownerPosts: posts.filter(p => p.group === 'owners'),
      vetPosts: posts.filter(p => p.group === 'vets'),
      zhStyle: lang === 'zh' ? on : off,
      enStyle: lang === 'en' ? on : off,
      setZh: () => { document.documentElement.lang = 'zh-Hant-HK'; this.setState({ lang: 'zh' }); },
      setEn: () => { document.documentElement.lang = 'en'; this.setState({ lang: 'en' }); }
    };
  }
}
mountPage(Component);
</script>
</body>
</html>
