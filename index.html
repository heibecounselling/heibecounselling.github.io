<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: null, open: { 0: true } };
  }
  renderVals() {
    const lang = this.state.lang || this.props.startLang || 'zh';
    const T = window.CONTENT.home;
    const t = T[lang];
    const open = this.state.open;
    const faqs = t.faqs.map((f, i) => ({
      q: f.q, a: f.a, open: !!open[i], sign: open[i] ? '−' : '+',
      toggle: () => this.setState({ open: { ...this.state.open, [i]: !this.state.open[i] } })
    }));
    const base = 'border: 0; min-width: 44px; min-height: 36px; padding: 6px 12px; font-size: 14px; cursor: pointer; font-family: inherit;';
    const on = base + ' background: #3E5040; color: #FFFDF8;';
    const off = base + ' background: transparent; color: #4A443D;';
    const mailHref = 'mailto:dr.heibelau.work@gmail.com?subject=' + encodeURIComponent(lang === 'zh' ? '輔導服務查詢' : 'Counselling enquiry');
    return {
      t, faqs, mailHref,
      // 中文標題每行保持一行：字體大小按欄寬自動縮放 Chinese heading lines never wrap
      heroH1Style: "margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; line-height: 1.35; color: #2F3D31; " +
        (lang === 'zh'
          ? 'font-size: clamp(22px, 7.2vw, 52px); font-size: min(52px, calc(100cqi / 11.3));'
          : 'font-size: clamp(28px, 3.3vw, 40px); text-wrap: balance;'),
      heroLineStyle: lang === 'zh' ? 'white-space: nowrap;' : '',
      gmailHref: 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent('dr.heibelau.work@gmail.com') + '&su=' + encodeURIComponent(lang === 'zh' ? '輔導服務查詢' : 'Counselling enquiry'),
      vetsShareMailHref: 'mailto:dr.heibelau.work@gmail.com?subject=' + encodeURIComponent(lang === 'zh' ? '分享：給獸醫同業的想法與故事' : 'Share: thoughts and story from a vet colleague'),
      zhStyle: lang === 'zh' ? on : off,
      enStyle: lang === 'en' ? on : off,
      setZh: () => { document.documentElement.lang = 'zh-Hant-HK'; this.setState({ lang: 'zh' }); },
      setEn: () => { document.documentElement.lang = 'en'; this.setState({ lang: 'en' }); }
    };
  }
}
mountPage(Component);
</script>
